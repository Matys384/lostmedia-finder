[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lostmedia-finder"
version = "0.1.0"
description = "Resumable local video excerpt discovery and visual matching"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "typer>=0.15,<1", "httpx>=0.28,<1", "numpy>=2,<3", "pillow>=11", "imagehash>=4.3,<5", "opencv-python-headless>=4.10", "faiss-cpu>=1.10", "transformers>=4.50,<6", "torch>=2.7", "torchvision>=0.22", "yt-dlp>=2025.1", "python-multipart>=0.0.20", "filelock>=3", "curl-cffi>=0.14"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lostmedia = "lostmedia.cli:app"

[tool.setuptools.package-data]
lostmedia = ["static/*"]

[tool.setuptools.packages.find]
include = ["lostmedia*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

